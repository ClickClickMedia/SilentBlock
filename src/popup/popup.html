<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SilentBlock</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="popup" data-state="loading">
    <header class="head">
      <svg class="shield" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18 7 3.12v4.7c0 4.67-3.13 9.04-7 10.2-3.87-1.16-7-5.53-7-10.2V6.3l7-3.12z"/>
      </svg>
      <span class="brand">SilentBlock</span>
      <span class="version" id="version"></span>
    </header>

    <section class="row">
      <div>
        <div class="label">Protection</div>
        <div class="hint" id="protectionHint">&nbsp;</div>
      </div>
      <label class="switch" title="Turn SilentBlock on or off everywhere">
        <input type="checkbox" id="enabled" aria-label="Protection">
        <span></span>
      </label>
    </section>

    <section class="site" id="site">
      <div class="host" id="hostname">&nbsp;</div>
      <div class="row" id="siteRow">
        <div>
          <div class="label">Block on this site</div>
          <div class="hint" id="siteHint">&nbsp;</div>
        </div>
        <label class="switch" title="Pause SilentBlock on this site">
          <input type="checkbox" id="siteOn" aria-label="Block on this site">
          <span></span>
        </label>
      </div>
      <button class="btn primary reload" id="reload" hidden>Reload page to apply</button>
    </section>

    <section class="stat" id="stat">
      <span class="num" id="blocked">0</span>
      <span class="cap">requests blocked on this page</span>
    </section>

    <section class="actions" id="actions">
      <button class="btn" id="unwall" title="Remove an anti-adblock wall or overlay on this page">Kill nag wall</button>
      <label class="check"><input type="checkbox" id="unwallAlways"> Always on this site</label>
    </section>

    <footer class="foot">
      <a href="#" id="settings">Settings</a>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
