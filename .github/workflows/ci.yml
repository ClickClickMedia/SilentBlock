name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build (validates selectors and regexes in Chromium)
        run: npm run build
      - run: npm test
      - name: Chrome accepts the build
        run: node scripts/verify-load.mjs chrome
      - run: npm run test:e2e
      - name: Firefox smoke test
        run: npm run test:firefox
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: silentblock-${{ github.sha }}
          path: |
            release/*.zip
            dist/build-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
